<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Car Collection</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #eef2f7;
        color: #243247;
        margin: 0;
    }

    header {
        background-color: #243247;
        color: white;
        text-align: center;
        padding: 30px 20px;
    }

    #car-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
        max-width: 1000px;
        margin: 30px auto;
        padding: 0 20px;
    }

    .car {
        background-color: white;
        border-top: 5px solid #2563eb;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }

    .car h2 {
        margin-top: 0;
        color: #2563eb;
    }
</style>
</head>
<body>
<header>
    <h1>My Car Collection</h1>
    <p>Five cars created using JavaScript objects.</p>
</header>

<main id="car-list"></main>
<script>
    class Car {
        constructor(make, model, year, color, price) {
            this.make = make;
            this.model = model;
            this.year = year;
            this.color = color;
            this.price = price;
        }

        display() {
            return `
                <article class="car">
                    <h2>${this.make} ${this.model}</h2>
                    <p>Year: ${this.year}</p>
                    <p>Color: ${this.color}</p>
                    <p>Price: $${this.price.toLocaleString("en-US")}</p>
                </article>
            `;
        }
    }

    // Sample cars with fictional prices.
    const cars = [
        new Car("Toyota", "Corolla", 2020, "White", 18000),
        new Car("Honda", "Civic", 2019, "Blue", 17000),
        new Car("Ford", "Mustang", 2021, "Red", 32000),
        new Car("Chevrolet", "Camaro", 2022, "Black", 35000),
        new Car("BMW", "3 Series", 2023, "Silver", 42000)
    ];

    const carList = document.getElementById("car-list");

    cars.forEach(car => {
        carList.innerHTML += car.display();
    });
</script>
</body>
</html>
